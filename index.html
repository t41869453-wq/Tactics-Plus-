<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكتيك بلس - Tactic Plus</title>
    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding-bottom: 70px;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            border-bottom: 2px solid #10b981;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-btn.active {
            color: #10b981;
        }
        .match-card {
            background-color: #1e293b;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .league-name {
            font-size: 12px;
            color: #10b981;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
        }
        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
        }
        .team {
            width: 38%;
            text-align: center;
        }
        .score-box {
            width: 24%;
            text-align: center;
            background-color: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            color: #10b981;
            font-size: 16px;
        }
        .match-status {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
        .live-badge {
            color: #f87171;
            font-weight: bold;
        }
        .refresh-btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>تكتيك بلس</h2>
        <p>وجهتك الأولى لنتائج المباريات وأخبار كرة القدم</p>
    </div>

    <!-- قسم المباريات -->
    <div id="matches" class="tab-content active">
        <button class="refresh-btn" onclick="fetchRealMatches()">🔄 تحديث المباريات الآن</button>
        <h3>مباريات اليوم والنتائج الحية</h3>
        <div id="matches-container">
            <div class="match-card" style="text-align: center;">
                <p>جاري الاتصال بسيرفر المباريات الحقيقية...</p>
            </div>
        </div>
    </div>

    <!-- قسم الترتيب -->
    <div id="standings" class="tab-content">
        <h3>جدول الترتيب</h3>
        <div class="match-card">
            <p style="text-align: center;">قريباً جداً جدول ترتيب الدوريات الكبرى...</p>
        </div>
    </div>

    <!-- قسم الأخبار -->
    <div id="news" class="tab-content">
        <h3>آخر الأخبار</h3>
        <div class="match-card">
            <p style="text-align: center;">تابع أحدث أخبار الانتقالات والمباريات الحصرية...</p>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="openTab('matches', this)">
            <span>⚽</span>
            <span>المباريات</span>
        </button>
        <button class="nav-btn" onclick="openTab('standings', this)">
            <span>🏆</span>
            <span>الترتيب</span>
        </button>
        <button class="nav-btn" onclick="openTab('news', this)">
            <span>📰</span>
            <span>الأخبار</span>
        </button>
    </nav>

    <!-- سكربت الربط الحقيقي بالـ API -->
    <script>
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        const apiKey = 'Cy2zXdygU6MAVJa';
        const container = document.getElementById('matches-container');

        // دالة ترجمة حالة المباراة من أكواد iSports
        function getMatchStatus(status) {
            switch(status) {
                case 0: return 'لم تبدأ بعد';
                case 1: return '<span class="live-badge">🔴 الشوط الأول</span>';
                case 2: return '<span class="live-badge">⏸ استراحة</span>';
                case 3: return '<span class="live-badge">🔴 الشوط الثاني</span>';
                case 4: return '<span class="live-badge">🔴 أشواط إضافية</span>';
                case 5: return '<span class="live-badge">🔴 ركلات ترجيح</span>';
                case -1: return 'انتهت';
                case -10: return 'ملغاة';
                case -11: return 'مؤجلة';
                default: return 'اليوم';
            }
        }

        function fetchRealMatches() {
            container.innerHTML = `
                <div class="match-card" style="text-align: center;">
                    <p>جاري جلب أحدث النتائج من iSports...</p>
                </div>
            `;

            // رابط جدول مباريات اليوم والنتائج الحية
            const targetUrl = `https://api.isportsapi.com/sport/football/schedule/basic?api_key=${apiKey}`;
            // استخدام وسيط corsproxy لتمرير الطلب بدون حظر المتصفح
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error('فشل الاتصال بالوسيط');
                    return response.json();
                })
                .then(result => {
                    if (result.code === 0 && result.data && result.data.length > 0) {
                        container.innerHTML = '';

                        // عرض أول 40 مباراة لسرعة الأداء
                        result.data.slice(0, 40).forEach(match => {
                            const homeTeam = match.homeName || 'الفريق الأول';
                            const awayTeam = match.awayName || 'الفريق الثاني';
                            const homeScore = (match.status !== 0 && match.homeScore !== undefined) ? match.homeScore : '-';
                            const awayScore = (match.status !== 0 && match.awayScore !== undefined) ? match.awayScore : '-';
                            const league = match.leagueName || 'مباراة كرة قدم';
                            const statusText = getMatchStatus(match.status);

                            const card = document.createElement('div');
                            card.className = 'match-card';
                            card.innerHTML = `
                                <div class="league-name">${league}</div>
                                <div class="teams-row">
                                    <div class="team">${homeTeam}</div>
                                    <div class="score-box">${homeScore} - ${awayScore}</div>
                                    <div class="team">${awayTeam}</div>
                                </div>
                                <div class="match-status">${statusText}</div>
                            `;
                            container.appendChild(card);
                        });
                    } else {
                        // لو السيرفر رجع رسالة خطأ (مثل تفعيل الـ IP في لوحة iSports) هتظهر هنا
                        const msg = result.message || 'لا توجد مباريات متاحة حالياً';
                        container.innerHTML = `
                            <div class="match-card" style="text-align: center; color: #fbbf24;">
                                <p>رسالة من سيرفر iSports:</p>
                                <p dir="ltr" style="font-size: 13px; background: #0f172a; padding: 8px; border-radius: 5px;">${msg}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    container.innerHTML = `
                        <div class="match-card" style="text-align: center; color: #f87171;">
                            <p>تعذر جلب البيانات الحية حالياً. اضغط على زر التحديث بالأعلى للمحاولة مرة أخرى.</p>
                        </div>
                    `;
                });
        }

        // تشغيل الجلب فور فتح التطبيق
        fetchRealMatches();

        // تحديث تلقائي للنتائج كل 60 ثانية
        setInterval(fetchRealMatches, 60000);
    </script>
</body>
    </html>
