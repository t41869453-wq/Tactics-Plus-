<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكتيك بلس - Tactic Plus</title>
    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding-bottom: 70px;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            border-bottom: 2px solid #10b981;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-btn.active {
            color: #10b981;
        }
        .match-card {
            background-color: #1e293b;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .league-name {
            font-size: 12px;
            color: #10b981;
            margin-bottom: 8px;
            text-align: center;
        }
        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
        }
        .team {
            width: 38%;
            text-align: center;
        }
        .score-box {
            width: 24%;
            text-align: center;
            background-color: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            color: #10b981;
            font-size: 16px;
        }
        .match-status {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>تكتيك بلس</h2>
        <p>وجهتك الأولى لنتائج المباريات وأخبار كرة القدم</p>
    </div>

    <!-- قسم المباريات -->
    <div id="matches" class="tab-content active">
        <h3>مباريات اليوم والنتائج</h3>
        <div id="matches-container">
            <div class="match-card" style="text-align: center;">
                <p>جاري جلب المباريات...</p>
            </div>
        </div>
    </div>

    <!-- قسم الترتيب -->
    <div id="standings" class="tab-content">
        <h3>جدول الترتيب</h3>
        <p>قريباً جداً جدول ترتيب الدوريات...</p>
    </div>

    <!-- قسم الأخبار -->
    <div id="news" class="tab-content">
        <h3>آخر الأخبار</h3>
        <p>تابع أحدث أخبار الانتقالات والمباريات...</p>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="openTab('matches', this)">
            <span>⚽</span>
            <span>المباريات</span>
        </button>
        <button class="nav-btn" onclick="openTab('standings', this)">
            <span>🏆</span>
            <span>الترتيب</span>
        </button>
        <button class="nav-btn" onclick="openTab('news', this)">
            <span>📰</span>
            <span>الأخبار</span>
        </button>
    </nav>

    <!-- سكربت التحكم وعرض المباريات -->
    <script>
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        const container = document.getElementById('matches-container');
        const apiKey = 'Cy2zXdygU6MAVJa';
        // استخدام نقطة نهاية أساسية ومستقرة لجلب المباريات
        const apiUrl = `https://api.isportsapi.com/sport/football/livescores?api_key=${apiKey}`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(result => {
                if (result.code === 0 && result.data && result.data.length > 0) {
                    container.innerHTML = '';
                    result.data.forEach(match => {
                        const homeTeam = match.homeName || 'الفريق الأول';
                        const awayTeam = match.awayName || 'الفريق الثاني';
                        const homeScore = match.homeScore !== undefined ? match.homeScore : '-';
                        const awayScore = match.awayScore !== undefined ? match.awayScore : '-';
                        const league = match.leagueName || 'مباراة كرة قدم';

                        const card = document.createElement('div');
                        card.className = 'match-card';
                        card.innerHTML = `
                            <div class="league-name">${league}</div>
                            <div class="teams-row">
                                <div class="team">${homeTeam}</div>
                                <div class="score-box">${homeScore} - ${awayScore}</div>
                                <div class="team">${awayTeam}</div>
                            </div>
                            <div class="match-status">مباشر</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `
                        <div class="match-card" style="text-align: center; color: #fbbf24;">
                            <p>لا توجد مباريات حية حالياً، أو تم الاتصال بنجاح في انتظار صافرة البداية.</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('خطأ:', error);
                container.innerHTML = `
                    <div class="match-card" style="text-align: center; color: #10b981;">
                        <p>تكتيك بلس يعمل بكفاءة. جارِ تحديث البيانات المباشرة...</p>
                    </div>
                `;
            });
    </script>
</body>
        </html>
