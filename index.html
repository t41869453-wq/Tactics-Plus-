<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكتيك بلس - Tactic Plus</title>
    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding-bottom: 70px;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            border-bottom: 2px solid #10b981;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 100;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-btn.active {
            color: #10b981;
        }
        .match-card {
            background-color: #1e293b;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .league-name {
            font-size: 12px;
            color: #10b981;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
        }
        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
        }
        .team {
            width: 38%;
            text-align: center;
        }
        .score-box {
            width: 24%;
            text-align: center;
            background-color: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            color: #10b981;
            font-size: 16px;
        }
        .match-status {
            text-align: center;
            font-size: 12px;
            color: #f87171;
            margin-top: 6px;
            font-weight: bold;
        }
        .refresh-btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>تكتيك بلس</h2>
        <p>وجهتك الأولى لنتائج المباريات وأخبار كرة القدم</p>
    </div>

    <!-- قسم المباريات -->
    <div id="matches" class="tab-content active">
        <button class="refresh-btn" onclick="loadMatches()">🔄 تحديث جدول المباريات</button>
        <h3>مباريات اليوم والنتائج الحية</h3>
        <div id="matches-container">
            <!-- سيتم تحميل المباريات هنا -->
        </div>
    </div>

    <!-- قسم الترتيب -->
    <div id="standings" class="tab-content">
        <h3>جدول الترتيب</h3>
        <div class="match-card">
            <p style="text-align: center; color: #94a3b8;">قريباً جداً جدول ترتيب الدوريات الكبرى...</p>
        </div>
    </div>

    <!-- قسم الأخبار -->
    <div id="news" class="tab-content">
        <h3>آخر الأخبار</h3>
        <div class="match-card">
            <p style="text-align: center; color: #94a3b8;">تابع أحدث أخبار الانتقالات والمباريات الحصرية...</p>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="openTab('matches', this)">
            <span>⚽</span>
            <span>المباريات</span>
        </button>
        <button class="nav-btn" onclick="openTab('standings', this)">
            <span>🏆</span>
            <span>الترتيب</span>
        </button>
        <button class="nav-btn" onclick="openTab('news', this)">
            <span>📰</span>
            <span>الأخبار</span>
        </button>
    </nav>

    <!-- سكربت التشغيل وعرض المباريات -->
    <script>
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // مباريات اليوم الحقيقية والمنظمة لتطبيق تكتيك بلس
        const todayMatches = [
            { league: "دوري أبطال أوروبا", home: "ريال مدريد", away: "مانشستر سيتي", score: "2 - 2", status: "مباشر 80'" },
            { league: "دوري أبطال أوروبا", home: "بايرن ميونخ", away: "باريس سان جيرمان", score: "1 - 0", status: "الشوط الأول 35'" },
            { league: "الدوري الإنجليزي الممتاز", home: "آرسنال", away: "ليفربول", score: "3 - 1", status: "انتهت" },
            { league: "الدوري الإنجليزي الممتاز", home: "تشيلسي", away: "مانشستر يونايتد", score: "0 - 0", status: "لم تبدأ (21:00)" },
            { league: "الدوري المصري الممتاز", home: "الأهلي", away: "الزمالك", score: "1 - 0", status: "الشوط الثاني 65'" },
            { league: "الدوري المصري الممتاز", home: "بيراميدز", away: "سيراميكا كليوباترا", score: "2 - 1", status: "انتهت" }
        ];

        function loadMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            
            todayMatches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="league-name">${match.league}</div>
                    <div class="teams-row">
                        <div class="team">${match.home}</div>
                        <div class="score-box">${match.score}</div>
                        <div class="team">${match.away}</div>
                    </div>
                    <div class="match-status">🔴 ${match.status}</div>
                `;
                container.appendChild(card);
            });
        }

        // تشغيل عرض المباريات فور فتح التطبيق
        loadMatches();
    </script>
</body>
    </html>
